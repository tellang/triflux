name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행을 취소한다. main push는 release.yml이 커밋마다 결과를 기다리므로
# 실행마다 고유 그룹을 써서 대기 중 교체도 막는다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 하한(22)과 릴리즈가 쓰는 24 를 함께 검사한다.
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # 의존성 설치 스크립트를 막는다. 서드파티 설치 스크립트가 없고 테스트는 setup 결과에 기대지 않는다.
        run: npm ci --ignore-scripts

      - name: Biome lint
        # ci.yml 이 `npm run lint` (biome) 를 안 돌려서 format/arg drift 가 main 에
        # invisible 하게 누적되고 release prepare 단계에서만 터졌다 (v10.28.0 release
        # blocker, PR #371). PR 시점에 fast-fail 로 잡는다.
        # NOTE: `lint` 스크립트는 packages/ 를 제외한다 — packages 미러는 아래
        # release:check-mirror 가 byte-identical 로 보증하므로 중복 검사 불필요.
        run: npm run lint

      - name: packages/triflux mirror byte-identical
        # packages-mirror.test.mjs 가 transitive 로 같은 검사를 돌지만, drift 시
        # unit test 실행 전에 fast-fail 로 끊어주면 원인 파악이 명확해진다.
        # PR #325 retro review (Codex) 가 발견한 dormant drift 같은 시나리오 가드.
        run: npm run release:check-mirror

      - name: packages version sync
        # root vs packages/{core,remote,triflux} package.json version drift 감지.
        run: npm run release:check-sync

      - name: Test (Codex config stability guard)
        run: npm run test:guard-codex-config
