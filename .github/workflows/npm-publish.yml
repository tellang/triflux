name: Publish to npm (Trusted Publishing OIDC)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm 11.5.1+
        run: npm --version

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # Each npm package needs a Trusted Publisher entry for OIDC/provenance.
      - name: Publish @triflux/core
        working-directory: packages/core
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
          else
            if [[ -n "${NPM_TOKEN:-}" ]]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            npm publish --provenance --access public
          fi

      - name: Publish @triflux/remote
        working-directory: packages/remote
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
          else
            if [[ -n "${NPM_TOKEN:-}" ]]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            npm publish --provenance --access public
          fi

      - name: Publish triflux
        working-directory: packages/triflux
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
          else
            if [[ -n "${NPM_TOKEN:-}" ]]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            npm publish --provenance --access public
          fi
